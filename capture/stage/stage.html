<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mockup stage</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage"></div>
<script>
// One composition per URL: stage.html?c=<name>&theme=light|dark
// Compositions live in compositions.json next to this file. Captures are served
// from the parent folder (../volbase/..., ../kyou/... and so on).

const q = new URLSearchParams(location.search);
const NAME = q.get('c');
const THEME = q.get('theme') === 'dark' ? 'dark' : 'light';
const stage = document.getElementById('stage');

const GRAIN = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
  '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>' +
  '<feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 1 0"/></filter>' +
  '<rect width="512" height="512" filter="url(#n)"/></svg>') + '")';

const SB_ICONS = `
<svg viewBox="0 0 20 14" width="20" fill="currentColor"><rect x="0" y="9" width="3.5" height="5" rx="1"/><rect x="5.5" y="6.5" width="3.5" height="7.5" rx="1"/><rect x="11" y="3.5" width="3.5" height="10.5" rx="1"/><rect x="16.5" y="0" width="3.5" height="14" rx="1"/></svg>
<svg viewBox="0 0 20 14" width="20" fill="currentColor"><path d="M10 12.8a1.6 1.6 0 1 1 0 .1zM10 8.6c1.6 0 3 .6 4.1 1.6l-1.5 1.5A3.7 3.7 0 0 0 10 10.7c-1 0-1.9.4-2.6 1l-1.5-1.5A5.8 5.8 0 0 1 10 8.6zm0-4.3c2.8 0 5.3 1.1 7.1 2.9l-1.5 1.5A7.9 7.9 0 0 0 10 6.4c-2.2 0-4.1.9-5.6 2.3L2.9 7.2A10 10 0 0 1 10 4.3zM10 0c4 0 7.5 1.6 10 4.1l-1.5 1.5A12 12 0 0 0 10 2.1c-3.3 0-6.3 1.4-8.5 3.5L0 4.1A14.1 14.1 0 0 1 10 0z"/></svg>
<svg viewBox="0 0 30 14" width="30"><rect x=".5" y=".5" width="25" height="13" rx="4" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="22" height="10" rx="2.5" fill="currentColor"/><path d="M27.5 5v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity=".4"/></svg>`;

const LOCK = '<svg viewBox="0 0 10 10"><path d="M2.5 4.5V3a2.5 2.5 0 0 1 5 0v1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="4.5" width="7" height="5" rx="1" fill="currentColor"/></svg>';

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function pickFile(d) {
  const f = d.file;
  if (typeof f === 'string') return f;
  return f[THEME] || f.light || f.dark;
}

function pick(v) {
  // theme-dependent scalar: either a plain value or {light, dark}
  if (v && typeof v === 'object' && !Array.isArray(v)) return v[THEME] ?? v.light ?? v.dark;
  return v;
}

function buildDevice(d) {
  const wrap = el('div', 'device ' + (d.layer || 'back'));
  const w = d.w;
  const aspect = d.aspect || 1.6; // screen w/h
  const src = '../' + pickFile(d);
  const img = new Image();
  img.src = src;
  const screen = el('div', 'screen');
  screen.appendChild(img);
  if (d.pos) screen.style.setProperty('--pos', pick(d.pos));
  if (d.zoom) {
    img.style.width = (d.zoom * 100) + '%';
    img.style.height = 'auto';
    img.style.objectFit = 'fill';
  }
  if (d.safeTop) {
    // web captures that came without a status bar: pad the top in the page's own colour
    screen.style.boxSizing = 'border-box';
    screen.style.paddingTop = d.safeTop + 'px';
    screen.style.background = pick(d.safeColor) || '#fff';
  }

  let node;
  if (d.frame === 'browser') {
    node = el('div', 'browser' + (pick(d.ui) === 'dark' ? ' is-dark' : ''));
    node.style.width = w + 'px';
    const bar = el('div', 'bar');
    bar.appendChild(el('div', 'lights', '<i></i><i></i><i></i>'));
    bar.appendChild(el('div', 'nav', '<span>&#x2039;</span><span>&#x203A;</span>'));
    bar.appendChild(el('div', 'url', '<span class="lock">' + LOCK + '</span><span>' + (d.url || '') + '</span>'));
    bar.appendChild(el('div', 'spacer'));
    node.appendChild(bar);
    screen.style.width = w + 'px';
    // screenH crops the page from the top (a shorter window), keeping whatever
    // sits below the crop line out of frame entirely.
    screen.style.height = (d.screenH ? d.screenH : Math.round(w / aspect)) + 'px';
    node.appendChild(screen);
  } else if (d.frame === 'mac') {
    node = el('div', 'mac');
    node.style.width = w + 'px';
    node.style.boxSizing = 'border-box';
    const sw = w - 28;
    screen.style.width = sw + 'px';
    screen.style.height = Math.round(sw / aspect) + 'px';
    node.appendChild(screen);
    node.appendChild(el('div', 'chin', '<i></i>'));
  } else if (d.frame === 'monitor') {
    node = el('div', 'monitor');
    node.style.width = w + 'px';
    node.style.boxSizing = 'border-box';
    const sw = w - 20;
    screen.style.width = sw + 'px';
    screen.style.height = Math.round(sw / aspect) + 'px';
    node.appendChild(screen);
  } else if (d.frame === 'phone') {
    node = el('div', 'phone');
    node.style.width = w + 'px';
    node.style.boxSizing = 'border-box';
    node.style.setProperty('--r', Math.round(w * 0.135) + 'px');
    const body = el('div', 'body');
    const sw = w - 30;
    const ph = d.aspect ? 1 / d.aspect : 2622 / 1206;
    screen.style.width = sw + 'px';
    screen.style.height = Math.round(sw * ph) + 'px';
    body.appendChild(screen);
    body.appendChild(el('div', 'island'));
    if (d.statusbar) {
      const sb = el('div', 'statusbar', '<span>9:41</span><span class="right">' + SB_ICONS + '</span>');
      const tone = pick(d.statusbar);
      sb.style.setProperty('--sb', tone === 'dark' ? '#111' : '#fff');
      body.appendChild(sb);
    }
    node.appendChild(body);
    ['action', 'vol-up', 'vol-dn', 'power', 'camera'].forEach(b => node.appendChild(el('i', 'btn ' + b)));
  } else if (d.frame === 'card') {
    node = el('div', 'card');
    node.style.width = w + 'px';
    screen.style.width = w + 'px';
    // height follows the capture's own aspect once it has loaded
    img.decode().then(() => {
      screen.style.height = Math.round(w * img.naturalHeight / img.naturalWidth) + 'px';
    });
    node.appendChild(screen);
  }

  wrap.appendChild(node);
  wrap.style.left = d.x + 'px';
  wrap.style.top = d.y + 'px';
  const t = [];
  if (d.persp) t.push('perspective(2600px) rotateY(' + d.persp + 'deg)');
  if (d.rotate) t.push('rotate(' + Math.max(-3, Math.min(3, d.rotate)) + 'deg)');
  if (t.length) wrap.style.transform = t.join(' ');
  if (d.origin) wrap.style.transformOrigin = d.origin;
  return { wrap, img };
}

async function main() {
  const comps = await (await fetch('compositions.json', { cache: 'no-store' })).json();
  const comp = comps.compositions.find(c => c.name === NAME);
  if (!comp) { stage.textContent = 'unknown composition: ' + NAME; stage.classList.add('ready'); return; }
  const [cw, ch] = comp.canvas || [1600, 1000];
  stage.style.width = cw + 'px';
  stage.style.height = ch + 'px';
  stage.dataset.product = comp.product;
  stage.dataset.theme = THEME;
  stage.style.setProperty('--grain', GRAIN);
  document.title = comp.name + ' ' + THEME;

  const imgs = [];
  for (const d of comp.devices) {
    const { wrap, img } = buildDevice(d);
    stage.appendChild(wrap);
    imgs.push(img);
  }
  await Promise.all(imgs.map(i => i.decode().catch(() => {})));
  await document.fonts.ready;
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('ready')));
}
main();
</script>
</body>
</html>
